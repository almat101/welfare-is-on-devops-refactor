<div class="basic-container">
	<main>
	  <section class="hero">
		<div class="hero-content">
		  <h1>I tuoi preferiti</h1>
		  <p>Descrizione</p>
		  <img src="https://images.unsplash.com/photo-1517999144091-3d9dca6d1e43?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8YmxhY2t8ZW58MHx8MHx8fDA%3D" alt="Immagine della categoria" class="hero-image">
		</div>
	  </section>

	  <section class="explore-section">
		<section class="articles container">
		  <div class="row">
			<ng-container *ngFor="let product of favourite_products?.content">
			  <div class="col-12 col-md-3 mb-4">
				<div class="card">
				  <!-- <img [src]="product.imageUrl" class="custom-img" alt="{{ product.name }}"> -->
				  <div class="card-body">
					<h5 class="card-title">{{ product.name }}</h5>
					<p class="card-text">{{ product.description }}</p>
					<p class="card-text">€{{ product.price}}</p>
					<button class="btn btn-primary m-2" *ngIf="product"  (click)="purchase(product.id!, 1)">Acquista</button>
					<button class="btn btn-secondary"  data-bs-toggle="button" (click)="favourite(product.id!)">
						<i class="bi bi-bookmark-star"></i>
						<!-- <i class="bi bi-star-fill"></i> -->
					</button>

				  </div>
				</div>
			  </div>
			</ng-container>
		  </div>
		</section>
	  </section>
	  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1200;">
		<div class="toast align-items-center text-bg-primary border-0" id="purchaseToast" role="alert" aria-live="assertive" aria-atomic="true">
			<div class="d-flex">
			  <div class="toast-body">
				<div class="toast-body">
					Acquisto avvenuto!
				</div>
			  </div>
			  <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
			</div>
		  </div>
	  <!-- <div id="purchaseToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
		<div class="toast-header">
		  <strong class="me-auto">Notification</strong>
		  <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
		</div>
		<div class="toast-body">
		  Acquisto avvenuto!
		</div>
	  </div> -->
	</div>
	</main>
  </div>

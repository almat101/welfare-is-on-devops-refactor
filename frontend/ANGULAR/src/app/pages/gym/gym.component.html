<div class="basic-container">
	<main>
	  <section class="hero">
		<div class="hero-content">
		  <h1>Palestre</h1>
		  <p>Cerca la palestra piu vicina a te</p>
		  <img src="https://images.unsplash.com/photo-1517999144091-3d9dca6d1e43?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8YmxhY2t8ZW58MHx8MHx8fDA%3D" alt="Immagine della categoria" class="hero-image">
		</div>
	  </section>

	  <section class="explore-section">
		<section class="articles container">
		  <div class="row">
			<div class="form-group">
		<button type="button" class="btn btn-dark m-3" (click)="updateMyLocation()">Aggiorna la posizione</button>
	</div>
			<ng-container *ngFor="let gym of gym_products">
			  <div class="col-12 col-md-3 mb-4">
				<div class="card">
				  <img [src]="gym.image_url" class="custom-img" alt="{{ gym.name }}">
				  <div class="card-body">
					<h5 class="card-title">{{ gym.name }}</h5>
					<p class="card-text">{{ gym.description }}</p>
					<p class="card-text">{{ gym.distance}}  km </p>
					<!-- <button class="btn btn-primary show-prodotto" (click)="goToProduct(product.id!)">Mostra prodotto</button> -->
				  </div>
				</div>
			  </div>
			</ng-container>
		  </div>
		</section>
	  </section>
	</main>
  </div>
